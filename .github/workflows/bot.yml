name: bot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "draft: open pull requests with new drafts; eval: measure draft quality and cost per model (no pull requests)"
        type: choice
        options: [draft, eval]
        default: draft
      max:
        description: "draft: maximum number of drafts (pull requests) this run"
        default: "20"
        required: false
      variants:
        description: "eval: comma-separated model[@effort] list"
        default: "claude-sonnet-5-5@medium,claude-haiku-5-5@medium,claude-haiku-5-5@high"
        required: false
      runs:
        description: "eval: drafts per reference rule and variant (1-10)"
        default: "3"
        required: false

permissions:
  contents: read

concurrency:
  group: bot
  cancel-in-progress: false

# No API key is stored anywhere. The job exchanges a GitHub OIDC token for Anthropic
# credentials through workload identity federation; see docs/bot-setup.md.
jobs:
  draft:
    if: github.event_name == 'schedule' || inputs.mode != 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push bot/* branches
      pull-requests: write   # open pull requests and the label
      id-token: write        # GitHub OIDC token for Anthropic workload identity federation
    env:
      HOLEALIGN_LLM_PROVIDER: anthropic
      HOLEALIGN_LLM_MODEL: claude-sonnet-5-5
      MAX_INPUT: ${{ inputs.max }}
    steps:
      - name: Check configuration
        id: gate
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -z "$FEDERATION_RULE_ID" || -z "$ORGANIZATION_ID" || -z "$SERVICE_ACCOUNT_ID" || -z "$OIDC_AUDIENCE" ]]; then
            echo "::notice::bot disabled: workload identity variables are not set"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          max="${MAX_INPUT:-20}"
          if [[ ! "$max" =~ ^[0-9]+$ ]] || (( max < 1 || max > 100 )); then
            echo "::error::max must be a number between 1 and 100"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "max=$max" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false   # scripts/bot-drafts.sh passes the token to the push only

      - name: Build holealign-server
        if: steps.gate.outputs.enabled == 'true'
        id: holealign
        uses: ./.github/actions/build-holealign

      - name: Week of the OSV cache
        if: steps.gate.outputs.enabled == 'true'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The OSV bulk exports (about 90 MB) are reused within a week; the cache is only a speed-up.
      - name: Restore OSV cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/osv-cache
          key: osv-cache-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Find candidates
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOLEALIGN_SERVER: ${{ steps.holealign.outputs.bin }}
          MAX: ${{ steps.gate.outputs.max }}
          CANDIDATES: ${{ runner.temp }}/candidates.json
          OSV_CACHE: ${{ runner.temp }}/osv-cache
        run: |
          set -euo pipefail
          ecosystems="$(grep -v '^[[:space:]]*#' coverage/ecosystems.txt | grep -v '^[[:space:]]*$' | paste -sd, -)"
          mkdir -p "$OSV_CACHE"
          # Five times the draft limit: candidates that already have a branch or pull request are
          # skipped by bot-drafts.sh, and without headroom a run where the top MAX all have one
          # opens nothing.
          ncand=$((MAX * 5))
          # It parses untrusted OSV/KEV data: no GitHub or OIDC credentials in its environment.
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$HOLEALIGN_SERVER" rules candidates -rules rules -packages coverage/packages.txt \
            -ecosystems "$ecosystems" -since 30d -max "$ncand" -cache "$OSV_CACHE" -out "$CANDIDATES"

      # Only identifiers (not secret) and the token file path. scripts/bot-drafts.sh fetches the
      # short-lived GitHub OIDC token into that file itself, right before each draft.
      - name: Configure Anthropic identity federation
        if: steps.gate.outputs.enabled == 'true'
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          {
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/anthropic-oidc.jwt"
            echo "ANTHROPIC_FEDERATION_RULE_ID=$FEDERATION_RULE_ID"
            echo "ANTHROPIC_ORGANIZATION_ID=$ORGANIZATION_ID"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$SERVICE_ACCOUNT_ID"
            if [[ -n "$WORKSPACE_ID" ]]; then
              echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE_ID"
            fi
          } >> "$GITHUB_ENV"

      - name: Draft rules and open pull requests
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOLEALIGN_SERVER: ${{ steps.holealign.outputs.bin }}
          MAX: ${{ steps.gate.outputs.max }}
          CANDIDATES: ${{ runner.temp }}/candidates.json
          BOT_TOKEN: ${{ github.token }}   # the script uses it only for git push and gh, never for the drafter
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
        run: bash scripts/bot-drafts.sh "$CANDIDATES" "$MAX"

      - name: Remove Anthropic identity token
        if: always()
        run: rm -f -- "$RUNNER_TEMP/anthropic-oidc.jwt" "$RUNNER_TEMP/anthropic-oidc.jwt.tmp"

  # Manual only. Re-drafts every reviewed rule (hidden from the model) with each variant and
  # scores the drafts against the reviewed tests. Spends real money; opens no pull requests.
  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write        # GitHub OIDC token for Anthropic workload identity federation
    env:
      HOLEALIGN_LLM_PROVIDER: anthropic
      VARIANTS: ${{ inputs.variants }}
      RUNS: ${{ inputs.runs }}
    steps:
      - name: Check configuration
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -z "$FEDERATION_RULE_ID" || -z "$ORGANIZATION_ID" || -z "$SERVICE_ACCOUNT_ID" || -z "$OIDC_AUDIENCE" ]]; then
            echo "::error::workload identity variables are not set"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build holealign-server
        id: holealign
        uses: ./.github/actions/build-holealign

      - name: Configure Anthropic identity federation
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          {
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/anthropic-oidc.jwt"
            echo "ANTHROPIC_FEDERATION_RULE_ID=$FEDERATION_RULE_ID"
            echo "ANTHROPIC_ORGANIZATION_ID=$ORGANIZATION_ID"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$SERVICE_ACCOUNT_ID"
            if [[ -n "$WORKSPACE_ID" ]]; then
              echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE_ID"
            fi
          } >> "$GITHUB_ENV"

      - name: Evaluate
        env:
          HOLEALIGN_SERVER: ${{ steps.holealign.outputs.bin }}
          ANTHROPIC_OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
          OUT: ${{ runner.temp }}/eval
        run: |
          set -euo pipefail
          bash scripts/bot-eval.sh "$VARIANTS" "$RUNS" "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: ${{ runner.temp }}/eval/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove Anthropic identity token
        if: always()
        run: rm -f -- "$RUNNER_TEMP/anthropic-oidc.jwt" "$RUNNER_TEMP/anthropic-oidc.jwt.tmp"
