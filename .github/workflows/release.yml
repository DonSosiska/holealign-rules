name: release

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "tests/**"
  schedule:
    # Refresh the 720h (30-day) signed latest.json twice a month so it never expires.
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; never cancel one in flight.
concurrency:
  group: rules-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds RULES_SIGNING_KEY. Configure required reviewers and restrict deployment
    # branches to main under Settings > Environments > rules-release.
    environment: rules-release
    permissions:
      contents: write   # GitHub release, tag and the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags, for the sequence number
          persist-credentials: false

      # An old commit or a re-run of an old run must not republish an older rule set
      # under a newer sequence number.
      - name: Require HEAD to be the tip of main
        run: |
          set -euo pipefail
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          head="$(git rev-parse HEAD)"
          if [[ -z "$tip" || "$tip" != "$head" ]]; then
            echo "::error::HEAD ($head) is not the current tip of main (${tip:-unknown}); not releasing"
            exit 1
          fi

      - name: Require the public key
        run: |
          set -euo pipefail
          if [[ ! -s keys/rules-public.key ]]; then
            echo "::error::keys/rules-public.key is missing; generate the signing key and commit its public half first (see keys/README.md)"
            exit 1
          fi

      - name: Build holealign-server
        id: holealign
        uses: ./.github/actions/build-holealign

      - name: Next sequence number
        id: seq
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: echo "seq=$(bash scripts/next-seq.sh)" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        env:
          HOLEALIGN_SERVER: ${{ steps.holealign.outputs.bin }}
          SEQ: ${{ steps.seq.outputs.seq }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          "$HOLEALIGN_SERVER" rules build -rules rules -tests tests -seq "$SEQ" -out "$DIST"

      # The secret is referenced only here, and only to write the key file. The signer
      # reads the file and never sees the secret in its environment.
      - name: Write signing key
        env:
          KEY_FILE: ${{ runner.temp }}/rules-signing.key
          RULES_SIGNING_KEY: ${{ secrets.RULES_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RULES_SIGNING_KEY" ]]; then
            echo "::error::secret RULES_SIGNING_KEY is not set in the rules-release environment"
            exit 1
          fi
          umask 077
          printf '%s\n' "$RULES_SIGNING_KEY" > "$KEY_FILE"

      - name: Sign bundle
        env:
          HOLEALIGN_SERVER: ${{ steps.holealign.outputs.bin }}
          SEQ: ${{ steps.seq.outputs.seq }}
          DIST: ${{ runner.temp }}/dist
          KEY_FILE: ${{ runner.temp }}/rules-signing.key
        run: |
          set -euo pipefail
          "$HOLEALIGN_SERVER" rules sign -key "$KEY_FILE" -expires 720h "$DIST/rules-$SEQ.tar.gz"

      - name: Remove signing key
        if: always()
        env:
          KEY_FILE: ${{ runner.temp }}/rules-signing.key
        run: rm -f "$KEY_FILE"

      - name: Verify signature with the published public key
        env:
          HOLEALIGN_SERVER: ${{ steps.holealign.outputs.bin }}
          SEQ: ${{ steps.seq.outputs.seq }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          pub="$(tr -d '[:space:]' < keys/rules-public.key)"
          "$HOLEALIGN_SERVER" rules verify -pub "$pub" -pointer "$DIST/latest.json" "$DIST/rules-$SEQ.tar.gz"
          ls -l "$DIST"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SEQ: ${{ steps.seq.outputs.seq }}
          DIST: ${{ runner.temp }}/dist
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "rules-$SEQ" \
            "$DIST/rules-$SEQ.tar.gz" "$DIST/rules-$SEQ.tar.gz.sig" "$DIST/latest.json" \
            --target "$SHA" --title "rules-$SEQ" \
            --notes "Signed rules bundle $SEQ built from commit $SHA."

      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          SEQ: ${{ steps.seq.outputs.seq }}
          DIST: ${{ runner.temp }}/dist
        run: bash scripts/publish-pages.sh "$DIST" "$SEQ"
