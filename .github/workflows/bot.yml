name: bot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: Maximum number of drafts (pull requests) this run
        default: "20"
        required: false

permissions:
  contents: read

concurrency:
  group: bot
  cancel-in-progress: false

# No API key is stored anywhere. The job exchanges a GitHub OIDC token for Anthropic
# credentials through workload identity federation; see docs/bot-setup.md.
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push bot/* branches
      pull-requests: write   # open pull requests and the label
      id-token: write        # GitHub OIDC token for Anthropic workload identity federation
    env:
      PANOPTES_LLM_PROVIDER: anthropic
      PANOPTES_LLM_MODEL: claude-sonnet-5-5
      MAX_INPUT: ${{ inputs.max }}
    steps:
      - name: Check configuration
        id: gate
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -z "$FEDERATION_RULE_ID" || -z "$ORGANIZATION_ID" || -z "$SERVICE_ACCOUNT_ID" || -z "$OIDC_AUDIENCE" ]]; then
            echo "::notice::bot disabled: workload identity variables are not set"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          max="${MAX_INPUT:-20}"
          if [[ ! "$max" =~ ^[0-9]+$ ]] || (( max < 1 || max > 100 )); then
            echo "::error::max must be a number between 1 and 100"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "max=$max" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: true   # scripts/bot-drafts.sh pushes bot/* branches

      - name: Build panoptes-server
        if: steps.gate.outputs.enabled == 'true'
        id: panoptes
        uses: ./.github/actions/build-panoptes

      - name: Week of the OSV cache
        if: steps.gate.outputs.enabled == 'true'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The OSV bulk exports (about 90 MB) are reused within a week; the cache is only a speed-up.
      - name: Restore OSV cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/osv-cache
          key: osv-cache-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Find candidates
        if: steps.gate.outputs.enabled == 'true'
        env:
          PANOPTES_SERVER: ${{ steps.panoptes.outputs.bin }}
          MAX: ${{ steps.gate.outputs.max }}
          CANDIDATES: ${{ runner.temp }}/candidates.json
          OSV_CACHE: ${{ runner.temp }}/osv-cache
        run: |
          set -euo pipefail
          ecosystems="$(grep -v '^[[:space:]]*#' coverage/ecosystems.txt | grep -v '^[[:space:]]*$' | paste -sd, -)"
          mkdir -p "$OSV_CACHE"
          "$PANOPTES_SERVER" rules candidates -rules rules -packages coverage/packages.txt \
            -ecosystems "$ecosystems" -since 30d -max "$MAX" -cache "$OSV_CACHE" -out "$CANDIDATES"

      # GitHub OIDC tokens live only a few minutes, so this runs right before drafting.
      # scripts/bot-drafts.sh re-fetches the token inside its loop when it gets old.
      # The token goes to a file (never to the environment); the IDs are not secret.
      - name: Obtain Anthropic identity token
        if: steps.gate.outputs.enabled == 'true'
        env:
          OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          umask 077
          jwt="$RUNNER_TEMP/anthropic-oidc.jwt"
          url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          sep='?'
          if [[ "$url" == *\?* ]]; then sep='&'; fi
          aud="$(jq -rn --arg a "$OIDC_AUDIENCE" '$a | @uri')"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${url}${sep}audience=${aud}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token"
            exit 1
          fi
          echo "::add-mask::$token"
          printf '%s' "$token" > "$jwt.tmp"
          mv -f "$jwt.tmp" "$jwt"
          {
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$jwt"
            echo "ANTHROPIC_FEDERATION_RULE_ID=$FEDERATION_RULE_ID"
            echo "ANTHROPIC_ORGANIZATION_ID=$ORGANIZATION_ID"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$SERVICE_ACCOUNT_ID"
            if [[ -n "$WORKSPACE_ID" ]]; then
              echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE_ID"
            fi
          } >> "$GITHUB_ENV"

      - name: Draft rules and open pull requests
        if: steps.gate.outputs.enabled == 'true'
        env:
          PANOPTES_SERVER: ${{ steps.panoptes.outputs.bin }}
          MAX: ${{ steps.gate.outputs.max }}
          CANDIDATES: ${{ runner.temp }}/candidates.json
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
        run: bash scripts/bot-drafts.sh "$CANDIDATES" "$MAX"

      - name: Remove Anthropic identity token
        if: always()
        run: rm -f -- "$RUNNER_TEMP/anthropic-oidc.jwt" "$RUNNER_TEMP/anthropic-oidc.jwt.tmp"
